name: Native integrations
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Native ${{ matrix.framework }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { framework: langgraph, package: 'langgraph==1.2.12' }
          - { framework: pydantic-ai, package: 'pydantic-ai-slim==2.54.0' }
          - { framework: llama-index, package: 'llama-index-core==0.14.25' }
          - { framework: openai-agents, package: 'openai-agents==0.23.1' }
          - { framework: anthropic, package: 'anthropic==1.11.0' }
          - { framework: agno, package: 'agno==3.1.1' }
          - { framework: dspy, package: 'dspy==3.4.0' }
          - { framework: smolagents, package: 'smolagents==1.26.0' }
          - { framework: google-adk, package: 'google-adk==2.11.0' }
          - { framework: semantic-kernel, package: 'semantic-kernel==1.44.1' }
          - { framework: haystack, package: 'haystack-ai==3.3.0' }
          - { framework: composio, package: 'composio==0.25.0' }
          - { framework: autogen, package: 'ag2==0.14.0' }
          - { framework: crewai, package: 'crewai==1.15.23' }
          - { framework: metagpt, package: 'metagpt==0.8.2' }
    env:
      MIMORI_NATIVE_FRAMEWORK: ${{ matrix.framework }}
      HAYSTACK_TELEMETRY_ENABLED: 'false'
      DO_NOT_TRACK: '1'
      PYTHONPATH: sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated native runtime
        if: matrix.framework != 'metagpt'
        run: python -m pip install -e './sdk[dev]' '${{ matrix.package }}'
      - name: Install experimental MetaGPT Action test stack
        if: matrix.framework == 'metagpt'
        run: |
          python -m pip install uv==0.11.33
          uv pip install --system --prerelease=allow --override sdk/tests/native/metagpt-overrides.txt -e './sdk[dev]' '${{ matrix.package }}'
          mkdir -p "$RUNNER_TEMP/metagpt/config"
          python -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"metagpt/config/config2.yaml"; p.write_text(json.dumps({"llm":{"api_type":"openai","model":"fixture","api_key":"provider-test-only","base_url":"http://127.0.0.1:1"}}))'
          echo "METAGPT_PROJECT_ROOT=$RUNNER_TEMP/metagpt" >> "$GITHUB_ENV"
      - name: Exercise native dispatcher
        run: python -m pytest sdk/tests/native/test_runtimes.py -q
  vercel:
    name: Native Vercel AI SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated AI SDK fixture
        run: |
          mkdir -p "$RUNNER_TEMP/vercel"
          npm install --prefix "$RUNNER_TEMP/vercel" ai@6.0.300 zod@4.6.5
      - name: Run actual AI SDK tool loop
        run: node sdk/tests/native/vercel.mjs
        env:
          MIMORI_VERCEL_PACKAGE: ${{ runner.temp }}/vercel/package.json
