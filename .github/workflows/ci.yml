name: CI

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
  push:
    branches: [main, release/v1]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dashboard:
    name: Dashboard Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Python 3.12 for release checks
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Audit npm dependencies
        run: python scripts/release/check-npm-audit.py

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Verify SDK redaction preserves security signals
        run: |
          python -m pip install -e './sdk'
          npm run test:security-pipeline

      - name: Run Vitest unit tests
        run: npm test

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key

  langchain:
    name: Current LangChain Agent Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install current LangChain and SDK
        run: python -m pip install -e './sdk[langchain,dev]' 'langchain>=1,<2'
      - name: Run SDK tests with real LangChain callbacks
        run: python -m pytest sdk/tests

  sdk:
    name: Python SDK Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: sdk/pyproject.toml

      - name: Install pip & SDK dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e './sdk[dev]'

      - name: Security audit (pip)
        run: |
          python -m pip install pip-audit
          python -m pip_audit --desc

      - name: Run Pytest
        run: python -m pytest sdk/tests

  database:
    name: PostgreSQL migrations and tenant isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations, repeat seeds, and test RLS
        run: bash scripts/release/check-database.sh

  distribution:
    name: SDK wheel and source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade pip setuptools wheel build
      - name: Build and install SDK distributions
        run: bash scripts/release/check-sdk-distribution.sh

  secrets:
    name: Candidate source and git-history secret review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch complete candidate history
        run: git fetch --unshallow --no-tags origin "$GITHUB_SHA"
      - name: Install pinned checksum-verified Gitleaks
        run: bash scripts/release/install-gitleaks.sh "$RUNNER_TEMP/gitleaks"
      - name: Reject unknown credential matches
        run: GITLEAKS_BIN="$RUNNER_TEMP/gitleaks/gitleaks" python scripts/release/check-secrets.py

  onboarding:
    name: Fresh local setup and authenticated browser flow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install -e './sdk'
      - run: npx playwright install --with-deps chromium
      - name: Run documented setup on a fresh database
        run: |
          if ! npm run setup > "$RUNNER_TEMP/mimori-setup.log" 2>&1; then
            echo "Local setup failed; raw output withheld because it may include disposable credentials."
            exit 1
          fi
      - name: Verify real onboarding and mobile navigation
        run: npm run test:auth
        env:
          MIMORI_SMOKE_PYTHON: python
      - name: Verify dashboard controls
        run: npm run test:e2e
      - name: Stop disposable services
        if: always()
        run: npx --yes supabase@2.119.0 stop --no-backup
